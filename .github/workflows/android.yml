name: Android CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --licenses 2>/dev/null < <(printf 'y\n%.0s' {1..1000})
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "cmake;3.18.1" \
            "ndk;21.4.7075529"

      - name: Prepare local Android paths
        shell: bash
        run: |
          mkdir -p android-sdk
          ln -sfn "${ANDROID_SDK_ROOT}/ndk/21.4.7075529" android-sdk/android-ndk-r21e
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          cmake.dir=${ANDROID_SDK_ROOT}/cmake/3.18.1
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
