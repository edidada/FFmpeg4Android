name: Android NDK build

# 只编译 ndk 分支。构建链 = Gradle 8 + AGP 8.2.2 + CMake/Ninja + NDK
# 27.0.12077973（NDK/CMake 由 AGP 按 ndkVersion / externalNativeBuild 自动下载，
# 许可在 runner 预接受），全部步骤统一走 bash shell（Windows runner 自带
# Git Bash），三大 OS（ubuntu / macos / windows）开箱即用。
# 成功佐证：job 日志会列出 APK 文件名 / 大小 / SHA256，并有 upload-artifact。

on:
  push:
    branches: [ndk]
  pull_request:
    branches: [ndk]
  workflow_dispatch:
    inputs:
      abi:
        description: "逗号分隔的 ABI 列表（如 arm64-v8a,armeabi-v7a；留空用默认 arm64-v8a）"
        required: false
        default: "arm64-v8a"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (with ffmpeg/zlib submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17 (required by AGP 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Android SDK dir (cross-OS)
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "SDK_DIR=$sdk" >> "$GITHUB_ENV"

      - name: Restore build caches (Gradle, NDK, CMake)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.SDK_DIR }}/ndk/27.0.12077973
            ${{ env.SDK_DIR }}/cmake/3.22.1
          key: ndkbuild-${{ matrix.os }}-v1
          restore-keys: ndkbuild-${{ matrix.os }}-

      - name: Resolve ABI list
        id: abi
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.abi }}" ]; then
            echo "abis=${{ github.event.inputs.abi }}" >> "$GITHUB_OUTPUT"
          else
            echo "abis=arm64-v8a" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (Gradle + AGP auto-managed NDK/CMake; first run downloads NDK/CMake)
        env:
          ANDROID_ABI_FILTERS: ${{ steps.abi.outputs.abis }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: "Report APK artifacts (proof: name / size / sha256)"
        shell: bash
        run: |
          echo "===== APK artifacts of ${{ matrix.os }} ====="
          found=0
          while IFS= read -r f; do
            found=1
            echo "APK   : $f"
            echo "SIZE  : $(du -h "$f" | cut -f1)"
            case "$(uname -s)" in
              Darwin) echo "SHA256: $(shasum -a 256 "$f" | cut -d' ' -f1)" ;;
              *)      echo "SHA256: $(sha256sum "$f" | cut -d' ' -f1)" ;;
            esac
          done < <(find app/build/outputs/apk -name '*.apk' -type f 2>/dev/null)
          echo "found=$found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFmpeg4Android-apk-${{ matrix.os }}
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
