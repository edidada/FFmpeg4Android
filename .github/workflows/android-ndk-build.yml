name: Android NDK build

# 只编译 ndk 分支。构建链 = Gradle 8 + AGP 8.2.2 + CMake/Ninja + NDK
# 27.0.12077973（NDK/CMake 由 AGP 按 ndkVersion / externalNativeBuild 自动下载，
# 许可在 runner 预接受），对官方标准托管运行器的全部平台/版本全支持：
#   Linux x64   : ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-26.04
#   Linux arm64 : ubuntu-24.04-arm, ubuntu-22.04-arm, ubuntu-26.04-arm
#   Windows x64 : windows-latest, windows-2025, windows-2025-vs2026, windows-2022
#   Windows arm : windows-11-arm, windows-11-vs2026-arm
#   macOS Intel : macos-15-intel, macos-26-intel
#   macOS arm64 : macos-latest, macos-14, macos-15, macos-26
# Linux/macOS job 用 bash；Windows job 用原生的 pwsh（不走 Git Bash）。
# 成功佐证：job 日志打印 APK 文件名 / 大小 / SHA256，并有 upload-artifact。

on:
  push:
    branches: [ndk]
  pull_request:
    branches: [ndk]
  workflow_dispatch:
    inputs:
      abi:
        description: "逗号分隔的 ABI 列表（如 arm64-v8a,armeabi-v7a；留空用默认 arm64-v8a）"
        required: false
        default: "arm64-v8a"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Linux (x64 & arm64) + macOS (Intel & Apple Silicon) ----------
  build-posix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-26.04-arm
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - macos-26
          - macos-15
          - macos-14
          - macos-latest
          - macos-26-intel
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (with ffmpeg/zlib submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 (required by AGP 8.x; JDK 17 missing on windows-11-arm image)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK (auto-install on SDK-less runners, e.g. ubuntu-*-arm)
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}${ANDROID_SDK_ROOT:-}" ]; then
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
            echo "Preinstalled SDK: $sdk"
          else
            sdk="$PWD/android-sdk"
            echo "No preinstalled SDK; installing cmdline-tools into $sdk"
            case "$(uname -s)" in
              Darwin) url=https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip ;;
              *)      url=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip ;;
            esac
            mkdir -p "$sdk/cmdline-tools"
            curl -fsSL -o /tmp/ci-cmdtools.zip "$url"
            unzip -qo /tmp/ci-cmdtools.zip -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          fi
          {
            echo "ANDROID_HOME=$sdk"
            echo "SDK_DIR=$sdk"
          } >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          if [ -n "${ANDROID_HOME:-}" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      # Google ships no arm64-linux Android host tools (NDK/AAPT2 are x86_64
      # only), so on ubuntu-*-arm runners install community native arm64
      # rebuilds: NDK r27 (HomuHomu833) placed at the exact dir AGP expects,
      # and a Commit451 aapt2 wired via android.aapt2FromMavenOverride.
      # Everything else (platforms, Gradle, JDK) is arch-independent.
      - name: Native arm64 Android toolchain (ubuntu-*-arm only)
        shell: bash
        if: runner.arch == 'ARM64'
        run: |
          set -e
          # --- NDK r27, native aarch64 host, at the path AGP expects ---
          ndkdir="${SDK_DIR:-$ANDROID_HOME}/ndk/27.0.12077973"
          if [ ! -f "$ndkdir/source.properties" ]; then
            echo "Fetching native arm64 NDK r27 (community build)"
            curl -fL --retry 3 -o /tmp/ndk-aarch64.tar.xz \
              "https://github.com/HomuHomu833/android-ndk-custom/releases/download/r27/android-ndk-r27-aarch64-linux-gnu.tar.xz"
            mkdir -p /tmp/ndk-aarch64 "$ndkdir"
            tar -xJf /tmp/ndk-aarch64.tar.xz -C /tmp/ndk-aarch64
            root="$(find /tmp/ndk-aarch64 -mindepth 1 -maxdepth 1 -type d | head -1)"
            mv "$root/." "$ndkdir/"
            rm -rf /tmp/ndk-aarch64 /tmp/ndk-aarch64.tar.xz
          fi
          echo "NDK at: $(head -4 "$ndkdir/source.properties")"
          # --- native arm64 aapt2 (Commit451) + Maven override ---
          btdir="${SDK_DIR:-$ANDROID_HOME}/build-tools/native-arm64"
          mkdir -p "$btdir" ~/.gradle
          if [ ! -x "$btdir/aapt2" ]; then
            curl -fL --retry 3 -o "$btdir/aapt2" \
              "https://github.com/Commit451/android-arm-build-tools/releases/download/platform-tools-37.0.0/aapt2"
            chmod +x "$btdir/aapt2"
            "$btdir/aapt2" version
          fi
          echo "android.aapt2FromMavenOverride=$btdir/aapt2" >> ~/.gradle/gradle.properties
          echo "aapt2 override -> $(tail -1 ~/.gradle/gradle.properties)"

      - name: Restore build caches (Gradle, NDK, CMake)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.SDK_DIR }}/ndk/27.0.12077973
            ${{ env.SDK_DIR }}/cmake/3.22.1
          key: ndkbuild-posix-${{ matrix.os }}-v1
          restore-keys: ndkbuild-posix-${{ matrix.os }}-

      - name: Resolve ABI list
        id: abi
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.abi }}" ]; then
            echo "abis=${{ github.event.inputs.abi }}" >> "$GITHUB_OUTPUT"
          else
            echo "abis=arm64-v8a" >> "$GITHUB_OUTPUT"
          fi

      # JDK17 already needed for Gradle; AGP downloads NDK/CMake automatically.
      - name: Build APK (Gradle + AGP auto-managed NDK/CMake; first run downloads NDK/CMake)
        env:
          ANDROID_ABI_FILTERS: ${{ steps.abi.outputs.abis }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: "Report APK artifacts (proof: name / size / sha256)"
        shell: bash
        run: |
          echo "===== APK artifacts of ${{ matrix.os }} ====="
          found=0
          while IFS= read -r f; do
            found=1
            echo "APK   : $f"
            echo "SIZE  : $(du -h "$f" | cut -f1)"
            case "$(uname -s)" in
              Darwin) echo "SHA256: $(shasum -a 256 "$f" | cut -d' ' -f1)" ;;
              *)      echo "SHA256: $(sha256sum "$f" | cut -d' ' -f1)" ;;
            esac
          done < <(find app/build/outputs/apk -name '*.apk' -type f 2>/dev/null)
          echo "found=$found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFmpeg4Android-apk-${{ matrix.os }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  # ---------- Windows (x64 & arm64), native pwsh shell (no Git Bash) ----------
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-2025
          - windows-2025-vs2026
          - windows-2022
          - windows-11-arm
          - windows-11-vs2026-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (with ffmpeg/zlib submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21 (required by AGP 8.x; JDK 17 missing on windows-11-arm image)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK (auto-install on SDK-less runners, e.g. windows-11-arm)
        shell: pwsh
        run: |
          $ah = [Environment]::GetEnvironmentVariable('ANDROID_HOME')
          $ar = [Environment]::GetEnvironmentVariable('ANDROID_SDK_ROOT')
          if ($ah -or $ar) {
            $sdk = if ($ah) { $ah } else { $ar }
            Write-Host "Preinstalled SDK: $sdk"
          } else {
            $sdk = Join-Path (Get-Location) 'android-sdk'
            Write-Host "No preinstalled SDK; installing cmdline-tools into $sdk"
            New-Item -ItemType Directory -Force -Path "$sdk\cmdline-tools" | Out-Null
            Invoke-WebRequest -UseBasicParsing `
              -Uri 'https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip' `
              -OutFile "$env:TEMP\ci-cmdtools.zip"
            Expand-Archive -Path "$env:TEMP\ci-cmdtools.zip" -DestinationPath "$sdk\cmdline-tools" -Force
            Move-Item "$sdk\cmdline-tools\cmdline-tools" "$sdk\cmdline-tools\latest" -Force
          }
          $slash = $sdk.Replace('\', '/')
          "ANDROID_HOME=$slash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SDK_DIR=$slash"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Accept Android SDK licenses
        shell: pwsh
        run: |
          if ($env:ANDROID_HOME) {
            $sm = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
            if (Test-Path $sm) {
              $answers = 1..200 | ForEach-Object { 'y' }
              $answers | & $sm --licenses | Out-Null
            }
          }

      - name: Restore build caches (Gradle, NDK, CMake)
        uses: actions/cache@v4
        with:
          path: |
            ~\.gradle\caches
            ~\.gradle\wrapper
            ${{ env.SDK_DIR }}/ndk/27.0.12077973
            ${{ env.SDK_DIR }}/cmake/3.22.1
          key: ndkbuild-win-${{ matrix.os }}-v1
          restore-keys: ndkbuild-win-${{ matrix.os }}-

      - name: Resolve ABI list
        id: abi
        shell: pwsh
        run: |
          $abi = "arm64-v8a"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.abi }}") {
            $abi = "${{ github.event.inputs.abi }}"
          }
          "abis=$abi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build APK (Gradle + AGP auto-managed NDK/CMake; first run downloads NDK/CMake)
        shell: pwsh
        run: .\gradlew.bat --no-daemon :app:assembleDebug
        env:
          ANDROID_ABI_FILTERS: ${{ steps.abi.outputs.abis }}

      - name: "Report APK artifacts (proof: name / size / sha256)"
        shell: pwsh
        run: |
          "===== APK artifacts of ${{ matrix.os }} ====="
          Get-ChildItem (Join-Path (Get-Location) 'app\build\outputs\apk') -Recurse -Filter *.apk -File |
            ForEach-Object {
              "APK   : $($_.FullName)"
              "SIZE  : {0:N2} MB" -f ($_.Length / 1MB)
              "SHA256: $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
            }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFmpeg4Android-apk-${{ matrix.os }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

