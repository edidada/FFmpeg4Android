apply plugin: 'com.android.application'

android {
    namespace "com.mabeijianxi.jianxiffmpegcmd"
    compileSdkVersion 34
    buildToolsVersion "36.0.0"
    ndkPath file("${rootProject.projectDir}/android-sdk/android-ndk-r21e").absolutePath
    defaultConfig {
        applicationId "com.mabeijianxi.jianxiffmpegcmd"
        minSdkVersion 16
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
            }
            ndk{
                abiFilters "armeabi-v7a","arm64-v8a","x86","x86_64"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += [
                    '**/libavcodec.so',
                    '**/libavfilter.so',
                    '**/libavformat.so',
                    '**/libavutil.so',
                    '**/libfdk-aac.so',
                    '**/libswresample.so',
                    '**/libswscale.so'
            ]
        }
    }
    externalNativeBuild {
        cmake {
            path file("CMakeLists.txt")
            version "3.18.1"
        }
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
