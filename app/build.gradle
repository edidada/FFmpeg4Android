apply plugin: 'com.android.application'

def ciAbis = System.getenv("ANDROID_ABI_FILTERS")

android {
    namespace "com.mabeijianxi.jianxiffmpegcmd"
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    // Use the exact NDK version the ffmpeg/zlib configs were generated with.
    // Gradle/AGP installs it automatically (download + license) on any OS.
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.mabeijianxi.jianxiffmpegcmd"
        // ffmpeg 3.2.5 source config was generated at android-21; source builds
        // must match, so min SDK is 21.
        minSdkVersion 21
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
            }
            ndk {
                // Local builds: all four ABIs. CI can narrow the set through the
                // ANDROID_ABI_FILTERS env var (comma separated) to save time.
                abiFilters ciAbis ? ciAbis.split(",").collect { it.trim() }
                                  : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += [
                    '**/libavcodec.so',
                    '**/libavfilter.so',
                    '**/libavformat.so',
                    '**/libavutil.so',
                    '**/libfdk-aac.so',
                    '**/libswresample.so',
                    '**/libswscale.so',
                    '**/libz.so'
            ]
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
